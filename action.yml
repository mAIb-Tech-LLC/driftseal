name: DriftSeal trust drift
description: Static agent dependency analysis and approved-baseline comparison; no cloud signup.
inputs:
  path:
    description: Local target directory or manifest
    default: '.'
  baseline:
    description: Optional committed approved baseline JSON
    default: '.driftseal-baseline.json'
  fail-on:
    description: Minimum finding severity that fails the job
    default: critical
  telemetry:
    description: Opt in to anonymous stage counts (no source, repository name or findings)
    default: 'false'
  installation-id:
    description: Optional random identifier for opt-in installation counting; never use a repository name
    default: ''
outputs:
  result:
    description: JSON result path
    value: ${{ steps.scan.outputs.result }}
  sarif:
    description: SARIF result path
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - id: scan
      shell: bash
      env:
        DRIFTSEAL_TARGET: ${{ inputs.path }}
        DRIFTSEAL_BASELINE: ${{ inputs.baseline }}
        DRIFTSEAL_FAIL_ON: ${{ inputs.fail-on }}
        DRIFTSEAL_TELEMETRY: ${{ inputs.telemetry }}
        DRIFTSEAL_INSTALLATION_ID: ${{ inputs.installation-id }}
        PYTHONPATH: ${{ github.action_path }}
      run: python "${{ github.action_path }}/scripts/action_scan.py"
